name: GIA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Syntax
        run: python -m compileall app
      - name: Tests
        env:
          GIA_AUTH_SECRET: ci-test-secret-not-for-prod
        run: pytest -q
