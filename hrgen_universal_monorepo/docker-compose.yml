services:
  voice-backend:
    build: .
    container_name: hrgen-voice-backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      KOKORO_TTS_URL: ${KOKORO_TTS_URL:-http://host.docker.internal:8888/v1/audio/tts}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:5173}
      APP_ENV: ${APP_ENV:-development}
      POD_SCHEDULER_ENABLED: ${POD_SCHEDULER_ENABLED:-false}
      POD_JOB_WEBHOOK_URL: ${POD_JOB_WEBHOOK_URL:-}
      POD_JOB_WEBHOOK_TOKEN: ${POD_JOB_WEBHOOK_TOKEN:-}
      SWARN_AUDITOR_INTERVAL_SECONDS: ${SWARN_AUDITOR_INTERVAL_SECONDS:-3600}
      LUCAS_GROWTH_INTERVAL_SECONDS: ${LUCAS_GROWTH_INTERVAL_SECONDS:-21600}
      SWARN_AUDITOR_PROMPT: ${SWARN_AUDITOR_PROMPT:-Review configured operational audit signals and return a concise findings summary.}
      LUCAS_GROWTH_PROMPT: ${LUCAS_GROWTH_PROMPT:-Review configured growth signals and return a concise experiment and content-opportunity summary.}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
